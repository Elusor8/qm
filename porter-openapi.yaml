          description: User id (encoded as string) or API token unique_id; empty when no actor was identified
          example: '58392'
        actor_name:
          type: string
          description: |
            Human-readable label for the actor. For USER, the user's email.
            For API_TOKEN, the token's display name. Soft-deleted users and
            revoked tokens still resolve so historical entries are readable.
            Empty when the actor is unset or was never associated with this
            project.
          example: alice@example.com
        user_agent:
          type: string
          description: User-Agent header captured by the middleware (truncated to 512 chars)
          example: Mozilla/5.0
        resource_type:
          $ref: '#/components/schemas/ApiAuditLogResourceType'
          description: Resource family the request acted on.
        resource_id:
          type: string
          description: ID of resource associated with the request.
          example: 22a55c5d-92aa-4b04-9b54-3a8ec3d6d4af
        resource_name:
          type: string
          description: Name of resource associated with the request.
          example: my-app
        resource_metadata:
          $ref: '#/components/schemas/ApiAuditLogResourceMetadata'
        status_code:
          type: integer
          format: int32
          description: HTTP response status code
          example: 200
        source:
