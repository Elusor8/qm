      x-go-type: sandboxapi.MetricsSummaryResponse
      x-go-type-import:
        name: sandboxapi
        path: github.com/porter-dev/code/sandbox/gen/sandboxapi
      required:
        - window_seconds
        - has_data
        - cpu_cores_p50
        - cpu_cores_p90
        - cpu_limit_cores
