          description: Matching volumes
          items:
            $ref: '#/components/schemas/SandboxVolume'
    SandboxVolumeCreateRequest:
      type: object
      description: A volume to create.
      x-go-type: sandboxapi.VolumeSpec
      x-go-type-import:
        name: sandboxapi
        path: github.com/porter-dev/code/sandbox/gen/sandboxapi
      required:
        - name
      properties:
        name:
          type: string
          description: Volume name, unique within the cluster; must be a valid DNS label
    SandboxVolumeFileEntry:
      type: object
      description: One entry in a volume file listing.
      x-go-type: sandboxapi.VolumeFileEntry
      x-go-type-import:
        name: sandboxapi
        path: github.com/porter-dev/code/sandbox/gen/sandboxapi
      required:
        - name
        - type
        - size_bytes
      properties:
        name:
          type: string
          description: |
            Entry name within its parent directory, without any path separator
            (e.g. model.bin). Entries nest, so a directory name is carried once
            on the directory itself rather than repeated in the path of every
            entry beneath it. Reconstruct an entry's path relative to the volume
            root by joining the names from the listing's path down to the entry.
        type:
          type: string
          description: Whether the entry is a regular file or a directory
          enum:
            - file
            - directory
        size_bytes:
          type: integer
          format: int64
          description: Size of the entry in bytes. Zero for directories.
        modified_at:
          type: string
          format: date-time
          description: |
            When the entry was last modified. Always set on files; may be absent
            on directories when the volume's storage keeps no directory
            modification time.
        truncated:
          type: boolean
          description: |
            Set on a directory entry whose contents the walk did not fully read:
            the entry budget ran out before entering it, or the directory alone
            holds more entries than the budget. List the directory directly to
            read more of them. Never set on files.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SandboxVolumeFileEntry'
          description: |
            Entries directly inside this directory, directories before files and
            each group by name. Absent on files, and on a directory the walk did
            not enter (which carries truncated instead). Present and empty for a
            directory the walk read and found empty.
    SandboxVolumeFileList:
      type: object
      description: The result of walking one volume directory.
      x-go-type: sandboxapi.VolumeFileListResponse
      x-go-type-import:
        name: sandboxapi
        path: github.com/porter-dev/code/sandbox/gen/sandboxapi
      required:
        - path
        - entries
        - truncated
      properties:
        path:
          type: string
          description: The walked directory, relative to the volume root
        entries:
          type: array
          description: |
            Entries directly inside the walked directory, directories before
            files and each group by name. Entries nest, so everything the walk
            read below this level hangs off these entries rather than appearing
            here as a flat path.
          items:
            $ref: '#/components/schemas/SandboxVolumeFileEntry'
        truncated:
          type: boolean
          description: |
            Whether the walk stopped at its entry budget before reading every
            entry. Directories left unread or partially read carry their own
            truncated marker.
    SandboxVolumeFileMove:
      type: object
      description: Where to move a volume file or directory, and what to move.
      x-go-type: sandboxapi.VolumeFileMoveRequest
      x-go-type-import:
        name: sandboxapi
        path: github.com/porter-dev/code/sandbox/gen/sandboxapi
      required:
        - from
        - to
      properties:
        from:
          type: string
          description: File or directory to move, relative to the volume root, with or without a leading slash
        to:
          type: string
          description: Full new path for the entry, relative to the volume root, whose parent directory must already exist
    SandboxApiHealth:
