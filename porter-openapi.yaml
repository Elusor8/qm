    CloudAccountPlanType:
      type: string
      description: Cloud account plan type indicating whether the account is on free tier or paid
      enum:
        - FREE
        - PAID
      example: PAID
    CloudAccountPlanState:
      type: object
      required:
        - plan_type
      properties:
        plan_type:
          $ref: '#/components/schemas/CloudAccountPlanType'
    GetCloudAccountPlanStateResponseBody:
      type: object
      required:
        - cloud_account_plan_state
      properties:
        cloud_account_plan_state:
          $ref: '#/components/schemas/CloudAccountPlanState'
    ValidateCidrResponseBody:
      type: object
      required:
        - passed
      properties:
        passed:
          type: boolean
          description: Whether the provided CIDR ranges passed the validation
          example: false
        suggested_vpc_cidr:
          type: string
          description: Suggested VPC CIDR range if a conflict is detected
          example: 10.2.0.0/16
        suggested_service_cidr:
          type: string
          description: Suggested service CIDR range if a conflict is detected
          example: 10.3.0.0/16
        conflict_message:
          type: string
          description: Message describing the conflict if one is detected
          example: The VPC CIDR range 10.0.0.0/16 overlaps with an existing VPC in this region
    GetAzureWifSetupCommandResponseBody:
      type: object
      required:
        - setup_command
      properties:
        setup_command:
          type: string
          description: Shell command to run the Azure WIF setup script.
    ConnectAzureCloudAccountRequest:
      type: object
      required:
        - client_id
        - subscription_id
        - tenant_id
      properties:
        client_id:
          type: string
          description: Azure app registration client ID (appId).
          example: 8b32a525-58e4-4d22-8368-098e11d7f4dc
        subscription_id:
          type: string
          description: Azure subscription ID.
          example: d3b9d70c-74c7-4d50-a2cc-579bf51dc763
        tenant_id:
          type: string
          description: Azure Active Directory tenant ID.
          example: 1a6cedd1-302d-48f9-b893-b1895b3d8a9f
    ConnectAzureCloudAccountResponseBody:
      type: object
      required:
        - cloud_account_id
      properties:
        cloud_account_id:
          type: string
          format: uuid
          description: ID of the connected Azure cloud account.
          example: 123e4567-e89b-12d3-a456-426614174000
    CreateGcpCloudAccountRequest:
      type: object
      required:
        - gcp_project_id
      properties:
        gcp_project_id:
          type: string
          description: |
            Customer's GCP project ID (e.g. "my-prod-project"), not the
            project number. Validated against the standard GCP project ID
            regex.
          pattern: ^[a-z][-a-z0-9]{4,28}[a-z0-9]$
          example: my-prod-project
    CreateGcpCloudAccountResponseBody:
      type: object
      required:
        - cloud_account_id
        - cloud_shell_url
        - setup_command
        - expires_at
      properties:
        cloud_account_id:
          type: string
          format: uuid
          description: ID of the cloud account row created or rotated by this call.
          example: 4741dca9-ae17-417b-949e-1a18f91b77d9
        cloud_shell_url:
          type: string
          description: |
            Google Cloud Shell deeplink that pre-loads the public
            porter-dev/gcp-onboarding repo into a fresh shell session.
          example: https://shell.cloud.google.com/cloudshell/editor?cloudshell_git_repo=https%3A%2F%2Fgithub.com%2Fporter-dev%2Fgcp-onboarding
        setup_command:
          type: string
          description: |
            Single-line shell snippet the customer pastes into Cloud Shell to
            kick off bootstrap.sh with the three required env vars set.
          example: PORTER_API_URL="https://api.porter.run" PORTER_CLOUD_ACCOUNT_ID="4741dca9-..." PORTER_VERIFICATION_TOKEN="eyJhbGciOi..." ./bootstrap.sh
        expires_at:
          type: string
          format: date-time
          description: |
            Wall-clock time after which the embedded verification token is
            rejected by the /details and /bootstrap endpoints.
          example: '2026-05-12T15:44:43Z'
    CloudAccountDependent:
      type: object
      description: A resource still referencing the cloud account that prevents its disconnection
      required:
        - type
        - id
        - name
      properties:
        type:
          type: string
          description: The kind of resource
          enum:
            - cluster
            - object_storage
            - environment_group
          example: cluster
        id:
          type: string
          description: The resource's identifier, as a string
          example: '42'
        name:
          type: string
          description: Name of the resource
          example: prod-cluster
    CloudAccountDependents:
      type: object
      description: Active resources still referencing the cloud account
      required:
        - dependents
      properties:
        dependents:
          type: array
          description: Resources that must be removed before the cloud account can be disconnected
          items:
            $ref: '#/components/schemas/CloudAccountDependent'
    CreateAwsCloudAccountRequest:
      type: object
      required:
        - account_id
      properties:
        account_id:
          type: string
          description: AWS account ID to connect
          example: '123456789012'
    CreateAwsCloudAccountResponseBody:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the created cloud account
          example: 123e4567-e89b-12d3-a456-426614174000
    AwsCloudFormationResponseBody:
      type: object
      required:
        - cloudformation_url
      properties:
        cloudformation_url:
          type: string
          description: AWS console URL that launches the Porter IAM CloudFormation stack
          example: https://console.aws.amazon.com/cloudformation/home?#/stacks/create/review?templateURL=https://porter-role.s3.us-east-2.amazonaws.com/cloudformation-access-policy-external-id.json&stackName=PorterRole&param_ExternalIdParameter=c79fcf53-7163-4649-9881-a071bc64d923
    GcpWifStatusResponseBody:
      type: object
      required:
        - state
        - percent_complete
      properties:
        state:
          type: string
          enum:
            - none
            - initiated
            - syncing
            - connected
          description: |
            Current state of the GCP cloud account's Workload Identity
            Federation setup. Composed from the wif row (pre-cutover) and
            the cloud_account row (post-cutover). Same progression for
            fresh-connect and migrate flows. See the get_gcp_wif_status
            endpoint description for details.
          example: syncing
        percent_complete:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            SyncIam progress. Meaningful when state is `syncing`; 100 when
            state is `connected`; 0 otherwise.
          example: 60
    AzureFICMigrationStatusResponseBody:
      type: object
      required:
        - state
        - error_message
        - can_connect_via_fic
        - clusters_updated
        - secret_delete_command
        - azure_secret_exists
        - secret_warning_dismissed
      properties:
        state:
          type: string
          enum:
            - none
            - pending
            - running
            - cutting_over
            - completed
            - failed
          description: |
            Migration state. `none` when no migration has been started;
            otherwise the current migration row status.
          example: running
        error_message:
          type: string
          description: Failure reason. Empty unless state is `failed`.
          example: ''
        can_connect_via_fic:
          type: boolean
          x-go-name: CanConnectViaFIC
          description: Whether the account is linked to a federated identity.
          example: false
        clusters_updated:
          type: boolean
          description: Whether all clusters have been cut over to workload identity.
          example: false
        secret_delete_command:
          type: string
          description: |
            `az` snippet the customer runs to remove the now-unused client
            secret. Populated only once the migration is complete.
          example: ''
        azure_secret_exists:
          type: boolean
          description: |
            Whether the customer's Azure-side client secret still exists.
            Meaningful only once the migration is complete.
          example: false
        secret_warning_dismissed:
          type: boolean
          description: Whether the customer dismissed the lingering-secret warning.
          example: false
    GetGcpCloudAccountDetailsRequest:
      type: object
      required:
        - verification_token
      properties:
        verification_token:
          type: string
          minLength: 32
          description: |
            Bearer token issued by the create_gcp_cloud_account response.
            Validated against the hashed JWT stored on the
            gcp_workload_identities row; not consumed by this endpoint.
    GetGcpCloudAccountDetailsResponseBody:
      type: object
      required:
        - cloud_account_id
        - porter_project_id
        - gcp_project_id
        - tenant_external_id
        - porter_aws_account_id
        - porter_aws_role_name
      properties:
        cloud_account_id:
          type: string
          format: uuid
          description: Echo of the path param for client convenience.
          example: 123e4567-e89b-12d3-a456-426614174000
        porter_project_id:
          type: integer
          format: int64
          description: Porter project that owns the integration.
          example: 123
        gcp_project_id:
          type: string
          description: |
            Customer's GCP project ID the Terraform module will provision
            into. Echo of the value the customer submitted at initiate time.
          example: my-prod-project
        tenant_external_id:
          type: string
          description: |
            Per-tenant UUID embedded in resource names + the WIF provider
            attribute condition. Same value across rotations so the Terraform
            state path remains stable for the customer.
          example: c79fcf53-7163-4649-9881-a071bc64d923
        porter_aws_account_id:
          type: string
          description: |
            AWS account that Porter's CCP runs in. The customer's WIF
            provider trusts assumed-role sessions originating from this
            account.
          example: '992382605253'
        porter_aws_role_name:
          type: string
          description: |
            IAM role Porter's CCP self-assumes for tenant-scoped sessions
            used as the WIF subject token.
          example: porter-ccp
    BootstrapGcpCloudAccountRequest:
      type: object
      required:
        - verification_token
        - gcp_project_number
        - gcp_service_account_email
        - workload_identity_provider
      properties:
        verification_token:
          type: string
          minLength: 32
          description: |
            Single-use bearer token issued by create_gcp_cloud_account.
            Validated against the hashed JWT stored on the
            gcp_workload_identities row and consumed on success.
        gcp_project_number:
          type: string
          pattern: ^[0-9]+$
          description: |
            Numeric GCP project number for the project being bootstrapped.
            bootstrap.sh obtains this via `gcloud projects describe`.
          example: '551957868763'
        gcp_service_account_email:
          type: string
          description: |
            Full email of the GCP service account Terraform created. Porter
            impersonates this exact identity at federation time — the email
            is not derived from a naming convention so the Terraform module
            can change resource naming freely.
          example: porter-manager-6269@my-prod-project.iam.gserviceaccount.com
        workload_identity_provider:
          type: string
          description: |
            Full resource name of the Workload Identity Provider Terraform
            created (the `workload_identity_provider` Terraform output).
            Used verbatim as the federation audience.
          example: projects/551957868763/locations/global/workloadIdentityPools/porter-pool-6269/providers/porter-aws
    ClusterProvisioningStatus:
      type: string
      description: Overall status of cluster provisioning
      enum:
        - queued
        - in_progress
        - completed
        - failed
    ClusterResourceProgress:
      type: object
      description: Progress indicator showing completed vs total items
      required:
        - completed
        - total
      properties:
        completed:
          type: integer
          description: Number of items that have completed
          example: 2
        total:
          type: integer
          description: Total number of items
          example: 3
    ClusterResourcePhaseErrorCode:
      type: string
      description: Provider-specific error code explaining why the phase failed
      enum:
        - AWS_QUOTA_DENIED
    ClusterResource:
      type: object
      description: An individual cloud or cluster resource being provisioned
      required:
        - id
        - display_name
        - status
      properties:
        id:
          type: string
          description: Provider resource identifier or cluster resource name
          example: nat-09ea8077aea377c24
        display_name:
          type: string
          description: Human-readable name for the resource
          example: NAT Gateway (us-east-1a)
        url:
          type: string
          description: URL or endpoint for the resource (e.g., load balancer DNS)
          example: k8s-xxx-xxxx-xxxxx-xxxxxxxx.elb.us-east-1.amazonaws.com
        status:
          $ref: '#/components/schemas/ClusterProvisioningStatus'
    ClusterResourceGroup:
      type: object
      description: A group of related provider resources (for example NAT gateways, Cloud NAT, VNets, or subnets)
      required:
        - id
        - display_name
        - status
      properties:
        id:
          type: string
          description: Unique identifier for the resource group. Values are provider-specific.
          example: nat_gateways
        display_name:
          type: string
          description: Human-readable display name for the resource group
          example: NAT Gateways
        external_provider_id:
          type: string
          description: The external provider resource ID
          example: L-0263D0A3
        increase_link:
          type: string
          description: URL to the provider console page where a quota increase can be requested
        status:
          $ref: '#/components/schemas/ClusterProvisioningStatus'
        progress:
          $ref: '#/components/schemas/ClusterResourceProgress'
        resources:
          type: array
          description: List of individual resources in this group
          items:
            $ref: '#/components/schemas/ClusterResource'
    ClusterResourcePhase:
      type: object
      description: A provisioning phase containing related provider-specific resource groups
      required:
        - id
        - display_name
        - status
      properties:
        id:
          type: string
          description: Unique identifier for the phase
          example: network
          enum:
            - quota
            - network
            - compute
            - system
            - finalizing
        display_name:
          type: string
          description: Human-readable display name of the phase
          example: Network
        status:
          $ref: '#/components/schemas/ClusterProvisioningStatus'
        progress:
          $ref: '#/components/schemas/ClusterResourceProgress'
        error_code:
          $ref: '#/components/schemas/ClusterResourcePhaseErrorCode'
        resource_groups:
          type: array
          description: List of resource groups within this phase
          items:
            $ref: '#/components/schemas/ClusterResourceGroup'
    ClusterResourceStatus:
      type: object
      description: Status of cluster provisioning with a detailed, provider-aware resource breakdown by phase
      required:
        - status
        - updated_at
        - phases
      properties:
        status:
          $ref: '#/components/schemas/ClusterProvisioningStatus'
        updated_at:
          type: string
          format: date-time
          description: Timestamp of the last status update
          example: '2026-01-05T12:16:00Z'
        phases:
          type: array
          description: List of provisioning phases. The quota and finalizing phases are optional and may appear only for certain providers or cluster states.
          items:
            $ref: '#/components/schemas/ClusterResourcePhase'
    ClusterMetadataFeatureFlags:
      type: object
      required:
        - enable_loki_s3
        - karpenter_spot_enabled
        - internal_nlb_enabled
        - gke_alb_ingress_enabled
      properties:
        enable_loki_s3:
          type: boolean
          description: True if S3-backed Loki storage is available for this cluster.
        karpenter_spot_enabled:
          type: boolean
          description: True if Karpenter spot instance configuration is enabled for this cluster.
        internal_nlb_enabled:
          type: boolean
          description: True if web services on this cluster may select the internal load-balancer mode.
        gke_alb_ingress_enabled:
          type: boolean
          description: True if the GKE application load balancer ingress option is available for this cluster.
    ClusterMetadata:
      type: object
      required:
        - feature_flags
      properties:
        feature_flags:
          $ref: '#/components/schemas/ClusterMetadataFeatureFlags'
    MigrationPlan:
      x-scalar-ignore: true
      required:
        - source_cluster_id
        - destination_cluster_id
        - apps
      properties:
        source_cluster_id:
          type: integer
          description: ID of the source cluster
        destination_cluster_id:
          type: integer
          description: ID of the destination cluster if it already exists
        apps:
          type: array
          description: List of applications to migrate
          items:
            type: object
            required:
              - instance_id
            properties:
              instance_id:
                type: string
                description: ID of the application instance to migrate
    Migration:
      type: object
      x-scalar-ignore: true
      required:
        - migration_id
        - migration_plan
        - status
        - created_at_utc
      properties:
        migration_id:
          type: string
          description: Unique identifier of the migration
        migration_plan:
          $ref: '#/components/schemas/MigrationPlan'
        status:
          type: string
          enum:
            - in_progress
            - completed
            - failed
            - canceled
          description: Current status of the migration
        created_at_utc:
          type: string
          format: date-time
          description: Timestamp when the migration was created
        completed_at_utc:
          type: string
          format: date-time
          description: Timestamp when the migration completed (if applicable)
    App:
      type: object
      required:
        - id
        - name
        - cluster_id
        - deployment_target_id
        - git_repository
        - image_repository
        - created_at_utc
      properties:
        id:
          type: string
          description: Unique identifier of the application
        name:
          type: string
          description: Name of the application
        cluster_id:
          type: integer
          description: ID of the cluster this application belongs to
        deployment_target_id:
          type: string
          description: ID of the deployment target this application belongs to
        git_repository:
          type: string
          description: Git repository URL for the application
        image_repository:
          type: string
          description: Image repository URL for the application
        created_at_utc:
          type: string
          format: date-time
          description: Date and time when the application was created
    ListApplicationsItem:
      type: object
      required:
        - id
        - name
        - display_name
        - deployment_target_id
        - created_at
      properties:
        id:
          type: string
          description: Unique identifier of the application
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          description: Name of the application
          example: my-app
        display_name:
          type: string
          description: Display name of the application
          example: my-application
        deployment_target_id:
          type: string
          description: ID of the deployment target this application is deployed to
          example: 123e4567-e89b-12d3-a456-426614174000
        created_at:
          type: string
          format: date-time
          description: Date and time when the application was created
          example: '2021-01-01T00:00:00Z'
    Image:
      type: object
      required:
        - repository
        - tag
      properties:
        repository:
          type: string
          description: Repository of the image
        tag:
          type: string
          description: Tag of the image
    ApplicationBuildMethod:
      type: string
      description: Method to use for building the application
      enum:
        - buildpack
        - docker
      example: docker
    ApplicationBuildConfigPatch:
      type: object
      description: Build configuration for patching (all fields optional)
      properties:
        method:
          $ref: '#/components/schemas/ApplicationBuildMethod'
        context:
          type: string
          description: Context to use for building the application
          example: ./
        builder:
          type: string
          description: Builder to use for building the application (buildpack only)
          example: heroku/buildpacks:20
        buildpacks:
          type: array
          description: Buildpacks to use for building the application (buildpack only)
          items:
            type: string
          example:
            - heroku/nodejs
        dockerfile:
          type: string
          description: Path to the dockerfile to use for building the application (docker only)
          example: ./Dockerfile
    ApplicationBuildConfig:
      allOf:
        - $ref: '#/components/schemas/ApplicationBuildConfigPatch'
        - type: object
          required:
            - method
            - context
    ApplicationSource:
      type: object
      description: Configuration for the source that the application is deployed from
      required:
        - github_repository
        - branch
      properties:
        github_repository:
          type: string
          description: Name of the GitHub repository
          example: repo-owner/repo-name
        branch:
          type: string
          description: Branch of the GitHub repository
          example: main
    ApplicationServiceType:
      type: string
      enum:
        - web
        - worker
        - job
    ConnectionType:
      type: string
      description: Type of the connection
      enum:
        - awsRole
        - azureManagedIdentity
        - gcpServiceAccount
        - cloudSql
        - disk
    BaseConnection:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/ConnectionType'
          description: Type of the connection
          example: awsRole
    AwsRoleConnection:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseConnection'
        - type: object
          required:
            - role
          properties:
            role:
              type: string
              description: Role of the connection
              example: iam-role-name
    AzureManagedIdentityConnection:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseConnection'
        - type: object
          required:
            - identityName
            - resourceGroup
          properties:
            identityName:
              type: string
              description: Name of the user-assigned managed identity
              example: my-managed-identity
            resourceGroup:
              type: string
              description: Azure resource group where the managed identity lives
              example: my-resource-group
    GcpServiceAccountConnection:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseConnection'
        - type: object
          required:
            - serviceAccountEmail
          properties:
            serviceAccountEmail:
              type: string
              description: Fully-qualified email of the GCP IAM service account to impersonate
              example: my-app@my-project.iam.gserviceaccount.com
    CloudSqlInstance:
      type: object
      required:
        - connectionName
        - databasePort
      properties:
        connectionName:
          type: string
          description: Instance connection name (e.g. project:region:instance)
          example: project-123456:us-east1:instance-name
        databasePort:
          type: integer
          description: TCP port the database listens on
          example: 5432
    CloudSqlConfig:
      type: object
      required:
        - connectionName
        - databasePort
        - serviceAccount
      properties:
        connectionName:
          type: string
          deprecated: true
          description: 'Deprecated: use instances instead. Name of the Cloud SQL connection'
          example: project-123456:us-east1:instance-name
        databasePort:
          type: integer
          deprecated: true
          description: 'Deprecated: use instances instead. Port of the Cloud SQL connection'
          example: 5432
        serviceAccount:
          type: string
          description: Service account of the Cloud SQL connection
          example: my-service-account
        instances:
          type: array
          description: List of Cloud SQL instances to connect to. When present, takes precedence over connectionName and databasePort.
          items:
            $ref: '#/components/schemas/CloudSqlInstance'
    CloudSqlConnection:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseConnection'
        - type: object
          required:
            - config
          properties:
            config:
              $ref: '#/components/schemas/CloudSqlConfig'
    DiskConfig:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the disk connection
          example: my-disk
    DiskConnection:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseConnection'
        - type: object
          required:
            - config
          properties:
            config:
              $ref: '#/components/schemas/DiskConfig'
    Connection:
      oneOf:
        - $ref: '#/components/schemas/AwsRoleConnection'
        - $ref: '#/components/schemas/AzureManagedIdentityConnection'
        - $ref: '#/components/schemas/GcpServiceAccountConnection'
        - $ref: '#/components/schemas/CloudSqlConnection'
        - $ref: '#/components/schemas/DiskConnection'
      discriminator:
        propertyName: type
        mapping:
          awsRole: '#/components/schemas/AwsRoleConnection'
          azureManagedIdentity: '#/components/schemas/AzureManagedIdentityConnection'
          gcpServiceAccount: '#/components/schemas/GcpServiceAccountConnection'
          cloudSql: '#/components/schemas/CloudSqlConnection'
          disk: '#/components/schemas/DiskConnection'
    BaseService:
      type: object
      required:
        - name
        - run
        - type
        - cpu_cores
        - ram_megabytes
        - termination_grace_period_seconds
      properties:
        name:
          type: string
          description: Name of the service
          example: web-service
        run:
          type: string
          description: The command to run for the service
          example: python app.py
        type:
          $ref: '#/components/schemas/ApplicationServiceType'
          description: The type of the service
        cpu_cores:
          type: number
          format: float
          description: The number of CPU cores to allocate to the service
          example: 1
        ram_megabytes:
          type: integer
          description: The amount of memory to allocate to the service in megabytes
          example: 1024
        cpu_cores_limit:
          type: number
          format: float
          description: The CPU limit for the service (will default to not being set)
          example: 1
        ram_megabytes_limit:
          type: integer
          description: The memory limit for the service (will default to the requested memory - ram_megabytes)
          example: 1024
        gpu_cores:
          type: integer
          description: The number of GPU cores to allocate to the service
          example: 1
        node_group_id:
          type: string
          description: The ID of the user node group to run the service on. If not provided, the service will be run on the default node group
          example: 123e4567-e89b-12d3-a456-426614174000
        termination_grace_period_seconds:
          type: integer
          description: The number of seconds to wait before terminating the service
          example: 30
        service_mesh_enabled:
          type: boolean
          description: Boolean indicating if this service should be added to the service mesh
          example: false
        connections:
          type: array
          description: List of connections for the service
          items:
            $ref: '#/components/schemas/Connection'
    AutoscalingType:
      type: string
      description: Type of autoscaling configuration
      example: default
      enum:
        - default
        - custom
        - temporal
    AutoscalingBase:
      type: object
      required:
        - type
        - enabled
        - min_instances
        - max_instances
      properties:
        type:
          $ref: '#/components/schemas/AutoscalingType'
          description: Type of autoscaling configuration
        enabled:
          type: boolean
          description: Whether autoscaling is enabled
          example: true
        min_instances:
          type: integer
          description: Minimum number of instances to run
          example: 1
        max_instances:
          type: integer
          description: Maximum number of instances to run
          example: 10
    DefaultAutoscalingConfig:
      title: Default Autoscaling
      type: object
      description: Standard autoscaling based on CPU/Memory/GPU thresholds.
      allOf:
        - $ref: '#/components/schemas/AutoscalingBase'
        - type: object
          required:
            - cpu_threshold_percent
            - memory_threshold_percent
          properties:
            cpu_threshold_percent:
              type: integer
              description: CPU threshold percentage to trigger scaling
              example: 80
            memory_threshold_percent:
              type: integer
              description: Memory threshold percentage to trigger scaling
              example: 80
            gpu_threshold_percent:
              type: integer
              description: GPU threshold percentage to trigger scaling
              example: 80
            vram_threshold_percent:
              type: integer
              description: GPU memory threshold percentage to trigger scaling
              example: 80
    CustomAutoscalingConfig:
      title: Custom Autoscaling
      type: object
      description: Custom autoscaling based on a list of Prometheus queries.
      allOf:
        - $ref: '#/components/schemas/AutoscalingBase'
        - type: object
          required:
            - metric_name
            - threshold
            - query
          properties:
            metric_name:
              type: string
              description: Name of the metric to use for autoscaling
              example: container_memory_usage_bytes
            threshold:
              type: number
              format: double
              description: Threshold to trigger scaling
              example: 1000
            query:
              type: string
              description: Prometheus query to use for autoscaling
              example: avg(container_memory_usage_bytes) / 1000000
    TemporalAutoscalingConfig:
      title: Temporal Autoscaling
      type: object
      description: Autoscaling based on Temporal cloud triggers.
      allOf:
        - $ref: '#/components/schemas/AutoscalingBase'
        - type: object
          required:
            - integration_id
            - task_queue
            - target_queue_size
          properties:
            integration_id:
              type: string
              description: ID of the Temporal integration to use for autoscaling
              example: '123'
            task_queue:
              type: string
              description: Name of the Temporal task queue to monitor
              example: my-queue
            target_queue_size:
              type: integer
              description: Target number of tasks in the queue per replica
              example: 100
    AutoscalingConfig:
      description: Configures autoscaling for a service
      oneOf:
        - $ref: '#/components/schemas/DefaultAutoscalingConfig'
        - $ref: '#/components/schemas/CustomAutoscalingConfig'
        - $ref: '#/components/schemas/TemporalAutoscalingConfig'
      discriminator:
        propertyName: type
        mapping:
          default: '#/components/schemas/DefaultAutoscalingConfig'
          custom: '#/components/schemas/CustomAutoscalingConfig'
          temporal: '#/components/schemas/TemporalAutoscalingConfig'
    PathRoutingRewriteMode:
      type: string
      description: |
        Specifies how URL paths for path-based routing should be rewritten. Defaults to "all".

        If the path set in pathRouting is /api/v1, then api/v1/subpath will be rewritten as follows: 
        - all - (default) rewrite the entire path to the root path —> /.
        - prefix - rewrite the path for the URL path prefix only —> /subpath.
        - off - disable path rewriting —> /api/v1/subpath.
      enum:
        - 'off'
        - all
        - prefix
      example: all
    applications_PathRoute:
      type: object
      required:
        - path
        - port
      properties:
        path:
          type: string
          description: The URL path to route
          example: /api
        port:
          type: integer
          description: The port number to route to
          example: 8080
        service_name:
          type: string
          description: The name of the service. Defaults to the owning service. Required if application_name is set
          example: api-service
        application_name:
          type: string
          description: The name of the application. Defaults to the application of the current service
          example: my-app
    applications_PathRouting:
      type: object
      description: Configuration for path-based routing
      properties:
        rewrite_mode:
          $ref: '#/components/schemas/PathRoutingRewriteMode'
          description: Specifies how URL paths for path-based routing should be rewritten. Defaults to all
        paths:
          type: array
          description: List of path routes for custom routing
          items:
            $ref: '#/components/schemas/applications_PathRoute'
    AdvancedHealthCheck:
      type: object
      description: Advanced configuration for individual health checks
      x-scalar-ignore: true
      required:
        - enabled
        - timeout_seconds
      properties:
        enabled:
          type: boolean
          description: Whether the health check is enabled
        http_path:
          type: string
          description: HTTP path to use for the health check (Required - web services only)
        command:
          type: string
          description: Command to run for the health check (Required - worker services only)
        timeout_seconds:
          type: integer
          description: Number of seconds to wait before timing out the health check. Must be greater than 0
        initial_delay_seconds:
          type: integer
          description: Number of seconds to wait before starting the health check. Must be greater than or equal to 0
        period_seconds:
          type: integer
          description: How often (in seconds) to perform the health check. Must be greater than or equal to 1
        failure_threshold:
          type: integer
          description: Number of consecutive failures before the container is considered unhealthy. Must be greater than or equal to 1
    applications_MetricsScraping:
      type: object
      required:
        - enabled
        - port
        - path
        - scrape_interval_seconds
      properties:
        enabled:
          type: boolean
          description: Explicitly enables or disables metrics scraping for the service
          example: true
        port:
          type: integer
          description: Port to scrape metrics from
          example: 9090
        path:
          type: string
          description: Path to scrape metrics from
          example: /metrics
        scrape_interval_seconds:
          type: integer
          description: Interval in seconds to scrape metrics from the service
          example: 60
    WebService:
      title: Web
      type: object
      description: A web-facing service
      allOf:
        - $ref: '#/components/schemas/BaseService'
        - type: object
          required:
            - instances
            - port
            - private
          properties:
            instances:
              type: integer
              description: The number of instances to run for the service
              example: 1
            sleep:
              type: boolean
              description: Whether the service should sleep
              example: false
            port:
              type: integer
              description: The port that the service will listen on
              example: 8080
            autoscaling:
              $ref: '#/components/schemas/AutoscalingConfig'
            domains:
              type: array
              description: List of domains for this service
              items:
                $ref: '#/components/schemas/Domain'
            health_check:
              $ref: '#/components/schemas/HealthCheck'
            private:
              type: boolean
              description: Whether the web service is private (not publicly accessible). Deprecated; use load_balancer_config instead. Retained for back-compat with older clients.
              example: false
              deprecated: true
            load_balancer_config:
              $ref: '#/components/schemas/LoadBalancerConfig'
              description: Configures the load balancer that fronts the service. Deprecated; use load_balancers instead.
              deprecated: true
            load_balancers:
              type: array
              description: The load balancers serving this service. An empty list means no load balancer.
              items:
                $ref: '#/components/schemas/LoadBalancerConfig'
            ingress_annotations:
              type: object
              description: Map of annotations to apply to the ingress resource
              additionalProperties:
                type: string
              example:
                nginx.ingress.kubernetes.io/proxy-body-size: 100m
            disable_tls:
              type: boolean
              description: Whether to disable TLS certificate management on the cluster. If true, exposed applications will not be protected by TLS unless managed elsewhere
              example: false
            path_routing:
              $ref: '#/components/schemas/applications_PathRouting'
              description: Custom routing configuration for different URL paths
            liveness_check:
              $ref: '#/components/schemas/AdvancedHealthCheck'
              description: Advanced configuration for the liveness probe
            readiness_check:
              $ref: '#/components/schemas/AdvancedHealthCheck'
              description: Advanced configuration for the readiness probe
            startup_check:
              $ref: '#/components/schemas/AdvancedHealthCheck'
              description: Advanced configuration for the startup probe
            metrics_scraping:
              $ref: '#/components/schemas/applications_MetricsScraping'
              description: Metrics scraping configuration for the service
            forward_auth:
              type: boolean
              description: When true, nginx ingress annotations are added to route auth through the cluster's oauth2-proxy
              example: false
    WorkerService:
      title: Worker
      type: object
      description: A background worker service
      allOf:
        - $ref: '#/components/schemas/BaseService'
        - type: object
          required:
            - instances
          properties:
            instances:
              type: integer
              description: The number of instances to run for the service
              example: 1
            sleep:
              type: boolean
              description: Whether the service should sleep
              example: false
            autoscaling:
              $ref: '#/components/schemas/AutoscalingConfig'
            health_check:
              $ref: '#/components/schemas/HealthCheck'
            liveness_check:
              $ref: '#/components/schemas/AdvancedHealthCheck'
              description: Advanced configuration for the liveness probe
            readiness_check:
              $ref: '#/components/schemas/AdvancedHealthCheck'
              description: Advanced configuration for the readiness probe
            startup_check:
              $ref: '#/components/schemas/AdvancedHealthCheck'
              description: Advanced configuration for the startup probe
            metrics_scraping:
              $ref: '#/components/schemas/applications_MetricsScraping'
              description: Metrics scraping configuration for the service
    JobService:
      title: Job
      type: object
      description: A service for scheduled jobs or one-off job runs
      allOf:
        - $ref: '#/components/schemas/BaseService'
        - type: object
          required:
            - allowConcurrent
            - cron
            - suspendCron
            - timeoutSeconds
          properties:
            allowConcurrent:
              type: boolean
              description: Whether to allow concurrent job runs
              example: false
            cron:
              type: string
              description: Cron expression for the job
              example: 0 0 * * *
            suspendCron:
              type: boolean
              description: Whether to suspend the job
              example: false
            timeoutSeconds:
              type: integer
              description: Timeout for the job in seconds
              example: 3600
    ApplicationService:
      oneOf:
        - $ref: '#/components/schemas/WebService'
        - $ref: '#/components/schemas/WorkerService'
        - $ref: '#/components/schemas/JobService'
      discriminator:
        propertyName: type
        mapping:
          web: '#/components/schemas/WebService'
          worker: '#/components/schemas/WorkerService'
          job: '#/components/schemas/JobService'
    PredeployJobServicePatch:
      description: Configuration for a predeploy job for patching (all fields optional)
      type: object
      properties:
        run:
          type: string
          description: The command to run for the job
          example: python app.py
        cpu_cores:
          type: number
          format: float
          description: The number of CPU cores to allocate to the job
          example: 1
        ram_megabytes:
          type: integer
          description: The amount of memory to allocate to the job in megabytes
          example: 1024
        timeout_seconds:
          type: integer
          description: Timeout for the job in seconds
          example: 3600
        connections:
          type: array
          description: List of connections for the job
          items:
            $ref: '#/components/schemas/Connection'
    PredeployJobService:
      description: Configuration for a job service that runs before each new deployment
      allOf:
        - $ref: '#/components/schemas/PredeployJobServicePatch'
        - type: object
          required:
            - run
            - cpu_cores
            - ram_megabytes
            - timeout_seconds
    DeploymentStrategyConfig:
      type: object
      description: Deployment strategy configuration (default strategy is rolling)
      required:
        - type
      properties:
        type:
          type: string
          description: Type of deployment strategy
          enum:
            - rolling
            - blue_green
          example: rolling
        group:
          type: string
          description: Group to use for blue-green deployment (Required for blue_green type only)
          example: frontend-backend-group
    BaseApplicationConfig:
      type: object
      required:
        - services
      properties:
        image:
          $ref: '#/components/schemas/Image'
          description: Image repository URL for the application
        build:
          $ref: '#/components/schemas/ApplicationBuildConfig'
          description: Build configuration for the application
        source:
          $ref: '#/components/schemas/ApplicationSource'
          description: Source configuration for the application
        services:
          type: array
          description: List of services in the application
          items:
            $ref: '#/components/schemas/ApplicationService'
        variables:
          type: array
          description: List of variables for the application
          items:
            $ref: '#/components/schemas/EnvironmentGroupKeyValue'
        environment_groups:
          type: array
          description: List of environment variable groups for the application
          items:
            $ref: '#/components/schemas/ApplicationContractEnvironmentGroup'
        predeploy:
          $ref: '#/components/schemas/PredeployJobService'
          description: Job that runs before each deployment
        helm_overrides:
          type: string
          description: Base64 encoded Helm values to override default chart values
          example: eyJvdmVycmlkZV9maWVsZCI6Im92ZXJyaWRlX3ZhbHVlIn0=
        auto_rollback:
          type: boolean
          description: Whether automatic rollback is enabled (disabled by default)
          example: true
        deployment_strategy:
          $ref: '#/components/schemas/DeploymentStrategyConfig'
          description: Deployment strategy configuration
        efs_storage:
          $ref: '#/components/schemas/EFSStorage'
          description: (Deprecated) EFS shared storage configuration across services
          deprecated: true
        cloud_sql:
          $ref: '#/components/schemas/CloudSQL'
          description: (Deprecated) CloudSQL proxy configuration for the application
          deprecated: true
    CreateApplicationRequestBody:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseApplicationConfig'
        - type: object
          required:
            - name
            - deployment_target_id
          properties:
            name:
              type: string
              description: Name of the application
              example: my-app
            deployment_target_id:
              type: string
              format: uuid
              x-go-type: uuid.UUID
              description: ID of the deployment target this application is deployed to
              example: 05fb5b78-baa2-4857-9b46-101240ade656
            secrets:
              type: array
              description: List of secrets for the application
              items:
                $ref: '#/components/schemas/EnvironmentGroupKeyOptionalValue'
    EnvironmentGroupKeyNoValue:
      type: object
      x-scalar-ignore: true
      required:
        - key
      properties:
        key:
          type: string
          description: Name of the environment variable
          example: API_URL
    GetApplicationResponseBody:
      type: object
      description: Application with extra fields for GET requests
      allOf:
        - $ref: '#/components/schemas/BaseApplicationConfig'
        - type: object
          required:
            - id
            - name
            - display_name
            - deployment_target_id
            - updated_at
            - created_at
          properties:
            id:
              type: string
              description: Unique identifier of the application
              example: 123e4567-e89b-12d3-a456-426614174000
            name:
              type: string
              description: Name of the application
              example: my-app
            display_name:
              type: string
              description: Display name of the application
              example: my-application
            deployment_target_id:
              type: string
              description: ID of the deployment target this application is deployed to
              example: 05fb5b78-baa2-4857-9b46-101240ade656
            updated_at:
              type: string
              format: date-time
              description: Date and time when the application was last updated
            created_at:
              type: string
              format: date-time
              description: Date and time when the application was created
            secrets:
              type: array
              description: List of secrets for the application
              items:
                $ref: '#/components/schemas/EnvironmentGroupKeyNoValue'
            deploy_frozen_at:
              type: string
              format: date-time
              nullable: true
              description: When deploys were frozen. Null means not frozen.
            deploy_freeze_enabled:
              type: boolean
              description: Whether the deploy freeze feature is enabled for this project (LaunchDarkly flag).
    UpdateApplicationRequestBody:
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseApplicationConfig'
        - type: object
          properties:
            secrets:
              type: array
              description: List of secrets for the application
              items:
                $ref: '#/components/schemas/EnvironmentGroupKeyOptionalValue'
    ImagePatch:
      type: object
      description: Image configuration for patching. All fields are optional.
      properties:
        repository:
          type: string
          description: Repository of the image
        tag:
          type: string
          description: Tag of the image
    PredeployJobServicePatchOptional:
      description: Nullable wrapper for PredeployJobServicePatch. Set to null to delete the predeploy job.
      type: object
      properties:
        value:
          $ref: '#/components/schemas/PredeployJobServicePatch'
    PatchApplicationRequestBody:
      type: object
      description: Request body for partially updating an application's configuration. All fields are optional - only provided fields will be updated.
      properties:
        build:
          $ref: '#/components/schemas/ApplicationBuildConfigPatch'
          description: Build configuration for the application (all fields optional)
        image:
          $ref: '#/components/schemas/ImagePatch'
          description: Container image configuration for the application. Mutually exclusive with build - setting image will clear build configuration.
        predeploy:
          $ref: '#/components/schemas/PredeployJobServicePatchOptional'
          description: Job that runs before each deployment. Set to null to delete the predeploy job.
        variables:
          type: array
          description: List of environment variables for the application
          items:
            $ref: '#/components/schemas/EnvironmentGroupKeyValue'
        secrets:
          type: array
          description: List of secrets for the application (nil value preserves existing secret)
          items:
            $ref: '#/components/schemas/EnvironmentGroupKeyOptionalValue'
        environment_groups:
          type: array
          description: List of environment groups to sync with this application. If provided, replaces all existing synced env groups.
          items:
            $ref: '#/components/schemas/ApplicationContractEnvironmentGroup'
        helm_overrides:
          type: string
          description: Base64 encoded Helm values to override default chart values
          example: eyJvdmVycmlkZV9maWVsZCI6Im92ZXJyaWRlX3ZhbHVlIn0=
        auto_rollback:
          type: boolean
          description: Whether automatic rollback is enabled (disabled by default)
          example: true
        deployment_strategy:
          $ref: '#/components/schemas/DeploymentStrategyConfig'
          description: Deployment strategy configuration
        services:
          type: array
          description: List of services in the application. If provided, replaces all existing services.
          items:
            $ref: '#/components/schemas/ApplicationService'
        efs_storage:
          $ref: '#/components/schemas/EFSStorage'
          description: (Deprecated) EFS shared storage configuration - fully replaces existing if provided
          deprecated: true
        cloud_sql:
          $ref: '#/components/schemas/CloudSQL'
          description: (Deprecated) CloudSQL proxy configuration - fully replaces existing if provided
          deprecated: true
    GetApplicationBuildSettingsResponseBody:
      type: object
      description: Build configuration that must be resolved server-side
      required:
        - repository_url
        - variables
        - build_template_id
        - narvi_enabled
      properties:
        repository_url:
          type: string
          description: Repository the built image is pushed to
          example: registry.example.com/my-app
        variables:
          type: object
          description: Non-secret environment variables available to the build
          additionalProperties:
            type: string
          example:
            NODE_ENV: production
        build_template_id:
          type: string
          format: uuid
          x-go-type: uuid.UUID
          description: Build template applied to this application, or the nil UUID when none is set
          example: 123e4567-e89b-12d3-a456-426614174000
        narvi_enabled:
          type: boolean
          description: Whether the build template enables Narvi
          example: false
    SetNodeGroupRequestBody:
      type: object
      required:
        - node_group_id
      properties:
        node_group_id:
          type: string
          description: ID of the node group to assign to all services in the application. Passing "default" will set the node group to the default node group.
          example: 123e4567-e89b-12d3-a456-426614174000
    AutoscalingConfigOptional:
      description: Autoscaling configuration for patching services
      properties:
        type:
          $ref: '#/components/schemas/AutoscalingType'
          description: Type of autoscaling configuration
        enabled:
          type: boolean
          description: Whether autoscaling is enabled
          example: true
        min_instances:
          type: integer
          description: Minimum number of instances to run
          example: 1
        max_instances:
          type: integer
          description: Maximum number of instances to run
          example: 10
        cpu_threshold_percent:
          type: integer
          description: CPU threshold percentage to trigger scaling (Default autoscaling only)
          example: 80
        memory_threshold_percent:
          type: integer
          description: Memory threshold percentage to trigger scaling (Default autoscaling only)
          example: 80
        metric_name:
          type: string
          description: Name of the metric to use for autoscaling (Custom autoscaling only)
          example: container_memory_usage_bytes
        threshold:
          type: number
          format: double
          description: Threshold to trigger scaling (Custom autoscaling only)
          example: 1000
        query:
          type: string
          description: Prometheus query to use for autoscaling (Custom autoscaling only)
          example: avg(container_memory_usage_bytes) / 1000000
    PatchApplicationServiceRequestBody:
      type: object
      description: Request body for patching an application service
      properties:
        instances:
          type: integer
          description: Number of instances to run for the service - will be overwritten if autoscaling is enabled
          minimum: 0
          example: 3
        autoscaling:
          $ref: '#/components/schemas/AutoscalingConfigOptional'
          description: Autoscaling configuration for the service
        sleep:
          type: boolean
          description: Whether to enable sleep mode for the service, which pauses all instances
          example: false
    ApplicationWebhookEventType:
      type: string
      description: Type of application event that can trigger a webhook
      enum:
        - build
        - deploy
        - predeploy
      example: deploy
    ApplicationWebhookEventStatus:
      type: string
      description: Status of the application event that can trigger a webhook
      enum:
        - success
        - failed
        - canceled
      example: success
    ApplicationWebhook:
      type: object
      required:
        - url
        - app_event_type
        - app_event_status
      properties:
        url:
          type: string
          format: uri
          description: URL where the webhook will be sent
          example: https://example.com/webhook
        app_event_type:
          $ref: '#/components/schemas/ApplicationWebhookEventType'
          description: Type of application event that triggers this webhook
        app_event_status:
          $ref: '#/components/schemas/ApplicationWebhookEventStatus'
          description: Status of the application event that triggers this webhook
        payload_encryption_key:
          type: string
          description: Optional key used to encrypt the webhook payload. If not provided, payload will not be encrypted.
          example: my-secret-key
    UpdateApplicationWebhooksRequestBody:
      type: object
      required:
        - webhooks
      properties:
        webhooks:
          type: array
          description: List of webhooks to configure. Empty array removes all webhooks.
          items:
            $ref: '#/components/schemas/ApplicationWebhook'
    ScalingAutoscalingConfig:
      type: object
      x-scalar-ignore: true
      properties:
        min_instances:
          type: integer
          description: Minimum number of instances
        max_instances:
          type: integer
          description: Maximum number of instances
    ScaleApplicationServiceRequestBody:
      type: object
      description: |
        Request body for scaling an application service. The service must not be asleep. Only one of instances or autoscaling should be provided per request.
      properties:
        instances:
          type: integer
          description: |
            Number of instances to scale the service to. Must be non-negative. Cannot be set when default autoscaling is enabled on the service.
          minimum: 0
          example: 3
        autoscaling:
          $ref: '#/components/schemas/ScalingAutoscalingConfig'
          description: |
            Autoscaling configuration patch. Only supported for services with default autoscaling enabled (not custom or temporal). min_instances must not exceed max_instances when both are provided.
    ChangeApplicationGitHubSourceRequestBody:
      type: object
      required:
        - repo_name
        - branch
        - generate_workflow
      properties:
        repo_name:
          type: string
          description: The repository to deploy from, in owner/repo format
          example: porter-dev/porter
          minLength: 1
        branch:
          type: string
          description: The branch to deploy from
          example: main
          minLength: 1
        generate_workflow:
          type: boolean
          description: Whether to open a PR adding the Porter workflow to the repository
          default: false
    ChangeApplicationGitHubSourceResponseBody:
      type: object
      required:
        - add_workflow_pr_url
        - delete_workflow_pr_url
        - warnings
        - has_errors
      properties:
        add_workflow_pr_url:
          type: string
          description: URL for the PR that adds the workflow to the new source
        delete_workflow_pr_url:
          type: string
          description: URL for the PR that removes the old workflow
        warnings:
          type: array
          description: Any user-facing warnings about the source change
          items:
            type: string
