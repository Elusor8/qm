            - admin
      tags:
        - Cloud Accounts
      summary: Delete a cloud account
      description: |
        Disconnects a cloud account from the project and revokes Porter's access
        to it. The account must have no clusters, datastores, or environment
        groups still referencing it.
      parameters:
        - name: project_id
          in: path
          description: Project ID that the cloud account belongs to
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 123
        - name: cloud_account_id
          in: path
          description: Cloud account ID to delete
          required: true
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '204':
          description: Cloud account deleted
        '409':
          description: |
            The cloud account still has active resources referencing it and
            cannot be disconnected until they are removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudAccountDependents'
        default:
          description: |
            Error. 400 if the provider is not supported, 404 if it does not exist,
            500 otherwise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
