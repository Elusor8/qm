          description: p50 CPU usage as a percentage of the CPU limit. Zero when no limit is set.
        cpu_util_p90_pct:
          type: number
          format: double
          description: p90 CPU usage as a percentage of the CPU limit. Zero when no limit is set.
        mem_bytes_p50:
          type: integer
          format: int64
          description: 50th percentile memory usage in bytes. Includes page cache.
        mem_bytes_p90:
          type: integer
          format: int64
          description: 90th percentile memory usage in bytes. Includes page cache.
        mem_limit_bytes:
          type: integer
          format: int64
          description: Memory limit configured on the sandbox pod, in bytes. Zero when no limit is set.
        mem_util_p50_pct:
          type: number
          format: double
          description: p50 memory usage as a percentage of the memory limit. Zero when no limit is set.
        mem_util_p90_pct:
          type: number
          format: double
          description: p90 memory usage as a percentage of the memory limit. Zero when no limit is set.
