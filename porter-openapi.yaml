components:
  parameters:
    pagination:
      name: page
      in: query
      description: Page number (1-based)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: porter
  schemas:
    Error:
      x-scalar-ignore: true
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - INVALID_INPUT
            - INTERNAL_ERROR
            - PERMISSION_DENIED
            - NOT_FOUND
            - CONFLICT
          description: Error code that indicates the type of error that occurred. This is _not_ the HTTP status code.
        message:
          type: string
          description: Error message that can be displayed to the user
    Project:
      type: object
      x-scalar-ignore: true
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: Unique identifier of the project
          example: 1
        name:
          type: string
          description: Name of the project
          example: my-porter-project
    RolePermission:
      type: string
      x-scalar-ignore: true
      enum:
        - admin
        - developer
        - viewer
      description: Role/permission level
    Invite:
      type: object
      x-scalar-ignore: true
      required:
        - id
        - token
        - email
        - expired
        - accepted
        - kind
      properties:
        id:
          type: integer
          description: Unique identifier for the invite
        token:
          type: string
          description: Unique token for the invite
        email:
          type: string
          format: email
          description: Email address of the invited user
        expired:
          type: boolean
          description: Whether the invite has expired
        accepted:
          type: boolean
          description: Whether the invite has been accepted
        kind:
          $ref: '#/components/schemas/RolePermission'
    ProjectMember:
      type: object
      x-scalar-ignore: true
      required:
        - id
        - user_id
        - email
        - role
        - date_joined
      properties:
        id:
          type: integer
          description: Unique identifier for the role/membership record
        user_id:
          type: integer
          description: User ID of the member
        email:
          type: string
          format: email
          description: Email address of the member
        role:
          $ref: '#/components/schemas/RolePermission'
        date_joined:
          type: string
          format: date-time
          description: Date when the user joined the project (ISO 8601 format)
    ProjectSession:
      type: object
      description: |
        An active session belonging to a project member, annotated with which member
        it belongs to so the admin Sessions view can attribute and route each row.
      required:
        - id
        - user_id
        - user_email
        - status
        - created_at
        - expires_at
      properties:
        id:
          type: string
          description: Opaque session identifier
        user_id:
          type: integer
          description: ID of the member the session belongs to
        user_email:
          type: string
          description: Email of the member the session belongs to
        status:
          type: string
          description: Session status (typically "active")
          example: active
        created_at:
          type: string
          format: date-time
          description: When the session was created
        updated_at:
          type: string
          format: date-time
          description: When the session was last refreshed
        expires_at:
          type: string
          format: date-time
          description: When the session expires
        last_active_at:
          type: string
          format: date-time
          description: When the session last made a request, if known
        user_agent:
          type: string
          description: User agent recorded for the session, if known
    ProjectSessionsResponse:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSession'
    RevokeProjectSessionsTarget:
      type: object
      description: A single session to revoke, identified by its owning member and id.
      required:
        - user_id
        - session_id
      properties:
        user_id:
          type: integer
          description: ID of the member the session belongs to
        session_id:
          type: string
          description: Session identifier to revoke
    RevokeProjectSessionsRequest:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/RevokeProjectSessionsTarget'
    RevokeProjectSessionsResult:
      type: object
      description: Summary of a bulk revocation; some targets may fail independently.
      required:
        - total
        - revoked
        - failed
      properties:
        total:
          type: integer
          description: Number of sessions requested for revocation
        revoked:
          type: integer
          description: Number of sessions successfully revoked
        failed:
          type: integer
          description: Number of sessions that could not be revoked
    UserSession:
      type: object
      description: |
        A single authenticated session belonging to a Porter user. Porter sessions
        can originate from either the dashboard (browser) or the Porter CLI. CLI
        sessions are identifiable by a `porter-cli/` prefix on `user_agent`.
      required:
        - id
        - status
        - created_at
        - expires_at
      properties:
        id:
          type: string
          description: Opaque session identifier
        status:
          type: string
          description: Session status (typically "active" — revoked sessions are filtered out before the list is returned)
          example: active
        created_at:
          type: string
          format: date-time
          description: When the session was created
        updated_at:
          type: string
          format: date-time
          description: When the session was last refreshed
        expires_at:
          type: string
          format: date-time
          description: When the session expires
        last_active_at:
          type: string
          format: date-time
          description: When the session last made a request, if known
        user_agent:
          type: string
          description: User agent recorded for the session, if known
          example: porter-cli/0.78.0 (darwin; arm64)
        is_current:
          type: boolean
          description: |
            True when this session is the one the caller is currently using. Set
            only on the self endpoint (`GET /api/v2/user/sessions`); always false
            for the admin endpoint, where the concept doesn't apply.
          default: false
    UserSessionsResponse:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/UserSession'
    GitHubRepository:
      type: object
      x-scalar-ignore: true
      required:
        - id
        - name
        - full_name
      properties:
        id:
          type: integer
          description: ID of the GitHub repository
          example: 1234567890
        name:
          type: string
