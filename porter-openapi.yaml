      operationId: delete_sandbox_volume
      security:
        - bearerAuth:
            - developer
      tags:
        - Sandboxes
      responses:
        '204':
          description: Volume deleted
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/alpha/projects/{project_id}/clusters/{cluster_id}/v1/volume/{volume_id}/files:
    parameters:
      - name: project_id
        in: path
        description: Project ID
        required: true
        schema:
          type: integer
      - name: cluster_id
        in: path
        description: Cluster ID
        required: true
        schema:
          type: integer
      - name: volume_id
        in: path
        description: Volume ID
        required: true
        schema:
          type: string
    get:
      x-scalar-ignore: true
      summary: List sandbox volume files
      description: |
        List the files and directories under a path inside a volume. The listing
        walks the tree breadth-first up to a server-side entry budget, marking
        directories it did not fully read as truncated.
      operationId: list_sandbox_volume_files
      security:
        - bearerAuth:
            - developer
      tags:
        - Sandboxes
      parameters:
        - name: path
          in: query
          description: Directory to walk, relative to the volume root, with or without a leading slash. Defaults to the root.
          required: false
          schema:
            type: string
        - name: search
          in: query
          description: |
            Case-insensitive substring to match against entry names. When set,
            the response contains only matching entries from the same
            budget-bounded walk.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Directory listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxVolumeFileList'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/alpha/projects/{project_id}/clusters/{cluster_id}/v1/volume/{volume_id}/files/content:
    parameters:
      - name: project_id
        in: path
        description: Project ID
        required: true
        schema:
          type: integer
      - name: cluster_id
        in: path
        description: Cluster ID
        required: true
        schema:
          type: integer
      - name: volume_id
        in: path
        description: Volume ID
        required: true
        schema:
          type: string
    get:
      x-scalar-ignore: true
      summary: Read sandbox volume file
      description: Stream a file's raw bytes from a volume. A single byte range (e.g. bytes=0-1048575) reads part of the file; without one the whole file streams.
      operationId: read_sandbox_volume_file
      security:
        - bearerAuth:
            - developer
      tags:
        - Sandboxes
      parameters:
        - name: path
          in: query
          description: File to read, relative to the volume root, with or without a leading slash.
          required: true
          schema:
            type: string
        - name: Range
          in: header
          description: Single HTTP byte range to read instead of the whole file. A malformed range is ignored; a valid range outside the file is rejected with 416.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The file's bytes
          headers:
            Last-Modified:
              description: When the file was last modified, as an HTTP-date
              schema:
                type: string
            Accept-Ranges:
              description: Always bytes; single byte ranges are accepted
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: The requested byte range of the file
          headers:
            Content-Range:
              description: The satisfied range, as bytes start-end/size
              schema:
                type: string
            Last-Modified:
              description: When the file was last modified, as an HTTP-date
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '416':
          description: Requested range is outside the file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      x-scalar-ignore: true
      summary: Write sandbox volume file
      description: Write a file to a volume from the request body, creating parent directories as needed, within 30 seconds
      operationId: write_sandbox_volume_file
      security:
        - bearerAuth:
            - developer
      tags:
        - Sandboxes
      parameters:
        - name: path
          in: query
          description: File to write, relative to the volume root, with or without a leading slash.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: File written
        '413':
          description: File is larger than the write limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
