      x-scalar-ignore: true
      security:
        - bearerAuth:
            - developer
      tags:
        - Cloud Accounts
      summary: Create an AWS cloud account
      description: |
        Verifies Porter can assume the customer's role (proof the CloudFormation
        stack was applied) and creates the cloud account. Returns 409 while the
        stack has not been applied yet, so the caller can retry.
      parameters:
        - name: project_id
          in: path
          description: Project ID to create the cloud account for
          required: true
          schema:
            type: integer
            minimum: 1
          example: 123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAwsCloudAccountRequest'
      responses:
        '200':
          description: AWS cloud account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAwsCloudAccountResponseBody'
        '409':
          description: |
            The CloudFormation stack has not been applied yet, so Porter cannot
            assume the customer's role. Retry once the stack is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
