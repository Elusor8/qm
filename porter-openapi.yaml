      description: |
        Creates a new GCP cloud account in the initiated state and returns a
        Cloud Shell deeplink + one-line setup command the customer pastes
        into Cloud Shell. The setup command runs `bootstrap.sh` from the
        public porter-dev/gcp-onboarding repo, which calls back to Porter
        with the Terraform outputs to complete onboarding.

        Re-calling for a GCP project that already has an in-progress
        onboarding rotates the verification token while keeping the
        Terraform state path stable. Re-calling for a project that is
        already bootstrapped or onboarded via service-account JSON returns
        409.
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 123
      requestBody:
        required: true
