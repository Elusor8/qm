    ApiToken:
      type: object
      required:
        - unique_id
        - name
        - role
        - created_at
        - created_by
        - usage_status
      properties:
        unique_id:
          type: string
          description: Unique identifier used in JWT claims
          example: abc123-def456
        name:
          type: string
          description: Human-readable name for the token
          example: CI deploy token
        role:
          type: string
          description: Display name of the role (or access policy)
          example: developer
        created_at:
          type: string
          format: date-time
          description: When the token was created
        created_by:
          type: string
          description: Email of the user who created the token (empty if unknown)
          example: user@porter.run
        expiry:
          type: string
          format: date-time
          description: When the token expires (absent if it never expires)
        last_used_at:
          type: string
          format: date-time
          description: |
            Last time the token was used to authenticate. Absent when usage_status is "never" or "unknown".
        usage_status:
          type: string
          enum:
            - active
            - never
            - unknown
          description: |
            Interpretation of last_used_at. "active" — last_used_at is a real timestamp. "never" — token was created after usage tracking began but has not been used. "unknown" — token predates usage tracking; its history is not recorded.
    CreateApiTokenRequest:
      type: object
      required:
        - name
        - role
        - expiry
      properties:
        name:
          type: string
          description: Human-readable name for the token
          example: CI deploy token
        role:
          type: string
          description: Access role to assign to the token
          enum:
            - admin
            - developer
            - viewer
        expiry:
          type: string
          format: date-time
          description: When the token should expire.
    CreatedApiToken:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: |
            Signed JWT for authenticating API requests. This is the only time the plaintext token is returned.
    ApiAuditLogActorType:
      type: string
