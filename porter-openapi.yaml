openapi: 3.0.0
info:
  version: 1.0.0
  title: Porter API
  description: API for interfacing with porter.run
  contact:
    name: Porter
    email: support@porter.run
    url: https://porter.run
servers:
  - url: https://dashboard.porter.run
  - url: http://localhost:7835
  - url: http://localhost:3000
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: Applications
    description: Manage Porter applications and services.
  - name: Deployment Targets
    description: Manage Porter deployment targets.
  - name: Jobs
    description: Manage Porter jobs.
  - name: Environment Groups
    description: Manage environment variables, environment files, and secrets for Porter applications and services.
  - name: Clusters
    description: Manage Porter clusters.
  - name: Helm
    description: Manage Helm charts and default values.
  - name: GitHub
    description: Manage GitHub integrations and repository analysis.
  - name: Narvi
    description: Remote Docker builds powered by BuildKit.
  - name: Api Audit Logs
    description: Query the per-request audit log of API traffic.
  - name: Metadata
    description: Global Porter metadata, such as control plane egress IPs to allowlist.
paths:
  /api/v2/auth/session:
    get:
      x-scalar-ignore: true
      summary: Get session
      description: Encodes the provided access token into a cookie to be used for OAuth flows.
      operationId: auth_session
      security:
        - bearerAuth:
            - viewer
      responses:
        '200':
          description: Session encoded successfully
          content:
            application/json:
              schema:
                type: object
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/projects:
    get:
      x-scalar-ignore: true
      summary: List projects
      description: Returns a list of all projects the user has access to
      operationId: list_projects
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: object
                required:
                  - projects
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/projects/{project_id}/invites:
    parameters:
      - name: project_id
        in: path
        description: Project ID
        required: true
        schema:
          type: integer
    get:
      x-scalar-ignore: true
      summary: List project invites
      description: Returns a list of all active invites for a project
      operationId: list_invites
      security:
        - bearerAuth:
            - viewer
      responses:
        '200':
          description: List of project invites
          content:
            application/json:
              schema:
                type: object
                required:
                  - invites
                properties:
                  invites:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invite'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      x-scalar-ignore: true
      summary: Create project invite
      description: Creates a new invite for a user to join a project
      operationId: create_invite
      security:
        - bearerAuth:
            - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - emails
                - kind
              properties:
                emails:
                  type: array
                  items:
                    type: string
                    format: email
                  description: Email addresses of the users to invite
                  minItems: 1
                  maxItems: 50
                  example:
                    - user@example.com
                kind:
                  $ref: '#/components/schemas/RolePermission'
      responses:
        '200':
          description: Invites created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - invites
                  - failed_emails
                properties:
                  invites:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invite'
                  failed_emails:
                    type: array
                    items:
                      type: string
                      format: email
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/projects/{project_id}/invites/{invite_id}:
    parameters:
      - name: project_id
        in: path
        description: Project ID
        required: true
        schema:
          type: integer
      - name: invite_id
        in: path
        description: Invite ID
        required: true
        schema:
          type: integer
    delete:
      x-scalar-ignore: true
      summary: Delete project invite
      description: Deletes an existing project invite
      operationId: delete_invite
      security:
        - bearerAuth:
            - admin
      responses:
        '200':
          description: Invite deleted successfully
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/projects/{project_id}/members:
    parameters:
      - name: project_id
        in: path
        description: Project ID to list members for
        required: true
        schema:
          type: integer
    get:
      x-scalar-ignore: true
      summary: List project members
      description: Returns all members of a project with their roles and user information
      operationId: list_project_members
      security:
        - bearerAuth:
            - viewer
      responses:
        '200':
          description: List of project members
          content:
            application/json:
              schema:
                type: object
                required:
                  - members
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectMember'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/projects/{project_id}/roles/{role_id}:
    parameters:
      - name: project_id
        in: path
        description: Project ID
        required: true
        schema:
          type: integer
      - name: role_id
        in: path
        description: Role ID of the member whose role should be updated
        required: true
        schema:
          type: integer
    put:
      x-scalar-ignore: true
      summary: Update project member role
      description: Updates the role of a project member
      operationId: update_project_member_role
      security:
        - bearerAuth:
            - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  $ref: '#/components/schemas/RolePermission'
      responses:
        '200':
          description: Member role updated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - member
                properties:
                  member:
                    $ref: '#/components/schemas/ProjectMember'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      x-scalar-ignore: true
      summary: Delete project member
      description: Deletes a project member
      operationId: delete_project_member
      security:
        - bearerAuth:
            - admin
      responses:
        '204':
          description: Member deleted successfully
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/projects/{project_id}/sessions:
    parameters:
      - name: project_id
        in: path
        description: Project ID
        required: true
        schema:
          type: integer
    get:
      x-scalar-ignore: true
      summary: List active sessions for all members of a project
      description: |
        Returns the active sessions for every member of the project, each
        annotated with the member it belongs to. Caller must be a project admin.
        Porter staff sessions are included only when the caller is also Porter
        staff; otherwise they are filtered out.
      operationId: list_project_sessions
      security:
        - bearerAuth:
            - admin
      responses:
        '200':
          description: List of active sessions across all members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSessionsResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/projects/{project_id}/sessions/revoke:
    parameters:
      - name: project_id
        in: path
        description: Project ID
        required: true
        schema:
          type: integer
    post:
      x-scalar-ignore: true
      summary: Revoke multiple project member sessions
      description: |
        Bulk-revokes the listed sessions, potentially across multiple members.
        Caller must be a project admin. Each target's owning member must have a
        role in the project, and — critically — Porter staff sessions can only
        be revoked by other Porter staff, so customer admins cannot disrupt
        Porter support access. Targets that fail these checks (or are unknown)
        are counted as failed rather than aborting the whole request.
      operationId: revoke_project_sessions
      security:
        - bearerAuth:
            - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeProjectSessionsRequest'
      responses:
        '200':
          description: Revocation summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeProjectSessionsResult'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/invite/{token}:
    parameters:
      - name: token
        in: path
        description: Invite token
        required: true
        schema:
          type: string
    post:
      x-scalar-ignore: true
      summary: Accept project invite
      description: Accepts a project invite using the invite token for authenticated users
      operationId: accept_invite
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invite accepted successfully
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      x-scalar-ignore: true
      summary: Get invite
      description: Returns project name and invitee email if invite is valid
      operationId: get_invite
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Valid invite information
          content:
            application/json:
              schema:
                type: object
                required:
                  - target_email
                  - project_name
                properties:
                  target_email:
                    type: string
                    format: email
                    description: Email address the invite was sent to
                  project_name:
                    type: string
                    description: Name of the project being invited to
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/user/invites:
    get:
      x-scalar-ignore: true
      summary: List current user's valid invites
      description: Returns valid invites for the authenticated user. Email is automatically determined from authentication context.
      operationId: list_user_invites
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of invites
          content:
            application/json:
              schema:
                type: object
                required:
                  - invites
                properties:
                  invites:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invite'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/user/logout:
    post:
      x-scalar-ignore: true
      summary: Logout user
      description: Revokes the current session for the authenticated user
      operationId: logout_user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User logged out successfully
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/user:
    delete:
      x-scalar-ignore: true
      summary: Delete user account
      description: Permanently deletes the authenticated user's account and all associated data. This action cannot be undone.
      operationId: delete_user
      security:
        - bearerAuth: []
      tags:
        - Users
      responses:
        '204':
          description: User account deleted successfully
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/user/sessions:
    get:
      x-scalar-ignore: true
      summary: List the authenticated user's active sessions
      description: |
        Returns the user's active Porter sessions (browser and CLI). The session
        the caller is currently using is flagged with `is_current=true` so the UI
        can warn before revoking it.
      operationId: list_user_sessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of active sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionsResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/user/sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        description: Session identifier returned by GET /api/v2/user/sessions
        required: true
        schema:
          type: string
    delete:
      x-scalar-ignore: true
      summary: Revoke one of the authenticated user's sessions
      description: |
        Revokes the named session for the authenticated user. The session is
        invalidated immediately, ending the bearer token's usefulness.
      operationId: revoke_user_session
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session revoked
        '404':
          description: Session does not belong to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/sleep:
    get:
      x-scalar-ignore: true
      summary: Sleep for testing
      description: Sleeps for the specified number of seconds and returns a confirmation message. Useful for verifying graceful shutdown of the server.
      operationId: sleep
      security:
        - bearerAuth: []
      parameters:
        - name: seconds
          in: query
          required: true
          description: Number of seconds to sleep (0-300)
          schema:
            type: integer
            minimum: 0
            maximum: 300
      responses:
        '200':
          description: Successfully completed sleep
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: Confirmation message
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/metadata/control-plane-ips:
    get:
      summary: Get Porter control plane IPs
      description: Returns the Porter control plane egress CIDRs to allowlist for Kubernetes API (control plane) access.
      operationId: get_control_plane_ips
      security:
        - bearerAuth: []
      tags:
        - Metadata
      responses:
        '200':
          description: Porter control plane CIDRs
          content:
            application/json:
              schema:
                type: object
                required:
                  - cidrs
                properties:
                  cidrs:
                    type: array
                    description: Porter control plane egress CIDRs to allowlist for Kubernetes API access.
                    items:
                      type: string
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/projects/{project_id}/github/repositories:
    get:
      parameters:
        - name: project_id
          in: path
          description: Project ID to list GitHub repositories for
          required: true
          schema:
            type: integer
            minimum: 0
      summary: List GitHub Repositories For Project
      description: Lists all GitHub repositories connected to a project
      operationId: list_project_github_repositories
      x-scalar-ignore: true
      tags:
        - GitHub
      security:
        - bearerAuth:
            - viewer
      responses:
        '200':
          description: GitHub repositories retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - repositories
                properties:
                  repositories:
                    type: array
                    items:
                      $ref: '#/components/schemas/GitHubRepository'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      parameters:
        - name: project_id
          in: path
          description: Project ID to connect GitHub repository to
          required: true
          schema:
            type: integer
            minimum: 0
      summary: Connect GitHub Repository To Project
      description: Connects a GitHub repository to a project after validating that a user has access
      operationId: connect_github_repository
      x-scalar-ignore: true
      tags:
        - GitHub
      security:
        - bearerAuth:
            - developer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - github_repository_name
                - github_account_name
              properties:
                github_repository_name:
                  type: string
                  description: GitHub repository in format 'owner/repo'
                  pattern: ^[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+$
                  example: example/test
                github_account_name:
                  type: string
                  description: Name of the GitHub account to connect to
                  example: example
      responses:
        '200':
          description: GitHub repository connected successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - github_pr_url
                properties:
                  github_pr_url:
                    type: string
                    description: URL for the pull request to create the build workflow file
                    example: https://github.com/example/test/pull/123
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/projects/{project_id}/github/repositories/{github_repository_name}/pull-requests:
    get:
      x-scalar-ignore: true
      summary: List pull requests in a GitHub repository
      description: Returns a list of pull requests in a GitHub repository
      operationId: list_github_repository_pull_requests
      tags:
        - GitHub
      security:
        - bearerAuth:
            - viewer
      parameters:
        - name: project_id
          in: path
          description: Project ID that the GitHub repository is connected to
          required: true
          schema:
            type: integer
        - name: github_repository_name
          in: path
          description: Name of the GitHub repository
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of pull requests in the GitHub repository
          content:
            application/json:
              schema:
                type: object
                required:
                  - pull_requests
                properties:
                  pull_requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/GitHubPullRequest'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/projects/{project_id}/github/repositories/{github_repository_name}/build:
    post:
      parameters:
        - name: project_id
          in: path
          description: Project ID that GitHub repository is connected to
          required: true
          schema:
            type: integer
            minimum: 0
            example: 123
        - name: github_repository_name
          in: path
          description: Name of the GitHub repository to create a build for
          required: true
          schema:
            type: string
            example: repo-owner/repo-name
      summary: Create a build for a GitHub repository
      description: Creates a build for a GitHub repository
      operationId: build_github_repository
      x-scalar-ignore: true
      tags:
        - GitHub
      security:
        - bearerAuth:
            - developer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - commit_sha
                - build_settings_id
                - registry_urls
              properties:
                commit_sha:
                  type: string
                  description: Commit SHA to build
                  example: fa9c6f358b792d214cff5c095f52eed4a70b7259
                build_settings_id:
                  type: string
                  format: uuid
                  x-go-type: uuid.UUID
                  description: ID of the build settings to use for the build
                  example: 123e4567-e89b-12d3-a456-426614174000
                registry_urls:
                  type: array
                  description: URLs of the image repositories to push the built image to
                  items:
                    type: string
                  example:
                    - 012345678901.dkr.ecr.us-east-1.amazonaws.com
      responses:
        '200':
          description: Build created successfully
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/github/accounts/{github_account_name}/repositories/{github_repository_name}/stack-detect:
    post:
      x-scalar-ignore: true
      summary: Repository stack detection
      description: analyzes a Github repository to detect applications, frameworks, and deployment configuration
      operationId: stack_detect
      security:
        - bearerAuth: []
      parameters:
        - name: github_repository_name
          in: path
          required: true
          schema:
            type: string
            description: GitHub repository in format 'owner/repo'
            pattern: ^[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+$
            example: example/test
        - name: github_account_name
          in: path
          required: true
          schema:
            type: string
            description: Name of the GitHub account to connect to
            example: example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - branch
              properties:
                branch:
                  type: string
                  description: Git branch to analyze
                  example: main
                project_id:
                  type: integer
                  format: int64
                  description: Project ID to check for already-deployed apps (optional, enables deployment annotation)
                  example: 123
                cluster_id:
                  type: integer
                  format: int64
                  description: Cluster ID to check for already-deployed apps (optional, enables deployment annotation)
                  example: 456
      responses:
        '200':
          description: Repository Stack Detection Results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StackDetectionResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/projects/{project_id}/services:
    parameters:
      - name: project_id
        in: path
        description: Project ID to filter services by
        required: true
        schema:
          type: integer
    get:
      x-scalar-ignore: true
      summary: List services
      description: Returns resources that Porter manages such as clusters, databases, applications, etc.
      operationId: list_services
      security:
        - bearerAuth:
            - viewer
      parameters:
        - name: type
          in: query
          description: Filter services by type
          required: false
          schema:
            $ref: '#/components/schemas/ServiceType'
        - name: id
          in: query
          description: Filter services by uid
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: Filter services by status
          required: false
          schema:
            $ref: '#/components/schemas/ServiceStatus'
        - name: preview
          in: query
          description: Filter services by preview status. If true, only returns preview services. Otherwise returns non-preview services.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: List of services
          content:
            application/json:
              schema:
                type: object
                required:
                  - services
                properties:
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      x-scalar-ignore: true
      summary: Update service
      description: Updates an existing service in Porter
      tags:
        - experimental
      operationId: update_service
      security:
        - bearerAuth:
            - developer
      requestBody:
        description: Service update details
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        '200':
          description: Service updated successfully
          content:
            application/json:
              schema:
                type: object
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      x-scalar-ignore: true
      summary: Delete service
      description: Deletes an existing service in Porter
      tags:
        - experimental
      operationId: delete_service
      security:
        - bearerAuth:
            - developer
      parameters:
        - name: id
          in: query
          description: Filter services by uid
          required: true
          schema:
            type: string
        - name: type
          in: query
          description: Filter services by type
          required: true
          schema:
            $ref: '#/components/schemas/ServiceType'
      responses:
        '200':
          description: Service deleted successfully
          content:
            application/json:
              schema:
                type: object
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/projects/{project_id}/services/validate:
    parameters:
      - name: project_id
        in: path
        description: Project ID to validate services for
        required: true
        schema:
          type: integer
    post:
