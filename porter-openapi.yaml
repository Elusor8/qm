      enum:
        - cli
      example: cli
    ApiAuditLogQuery:
      type: object
      description: |
        Filter contract shared by all `/api-audit-log*/query` endpoints. Date
        range is required; every other field is optional and AND-ed when present.
      required:
        - start_date
        - end_date
      properties:
        start_date:
          type: string
          format: date-time
          description: Inclusive lower bound on `started_at` (RFC3339).
          example: '2026-04-23T00:00:00Z'
        end_date:
          type: string
          format: date-time
          description: Inclusive upper bound on `started_at` (RFC3339). Must not be in the future and must be after `start_date`.
          example: '2026-04-30T00:00:00Z'
        actors:
          type: array
          description: |
            Actors to include. Each element identifies one user or API token.
            Empty/omitted disables the filter. Mutually exclusive with `actors_exclude`
          items:
            $ref: '#/components/schemas/ApiAuditLogActorRef'
        actors_exclude:
          type: array
          description: |
            Actors to exclude. Empty/omitted disables the filter. Mutually exclusive with
            `actors`.
          items:
            $ref: '#/components/schemas/ApiAuditLogActorRef'
        methods:
          type: array
          description: |
            HTTP methods to include (uppercase, exact match). Empty/omitted
            disables the filter; rows whose method is in the set are returned.
            Mutually exclusive with `methods_exclude`.
          items:
            $ref: '#/components/schemas/ApiAuditLogMethod'
        methods_exclude:
          type: array
          description: |
            HTTP methods to exclude. Empty/omitted disables the filter. Mutually exclusive
            with `methods`.
          items:
            $ref: '#/components/schemas/ApiAuditLogMethod'
        status_codes:
          type: array
          description: |
            HTTP response status codes to include. Empty/omitted disables the
            filter; rows whose status_code is in the set are returned.
            Mutually exclusive with `status_codes_exclude`.
          items:
            type: integer
            format: int32
            minimum: 100
            maximum: 599
          example:
            - 200
            - 404
        status_codes_exclude:
          type: array
          description: |
            HTTP response status codes to exclude. Empty/omitted disables the filter. Mutually exclusive with
            `status_codes`.
          items:
            type: integer
            format: int32
            minimum: 100
            maximum: 599
          example:
            - 500
        path:
          type: string
          description: Filter by full request path (exact match, no query string).
          example: /api/v2/projects/12492/applications
        actions:
          type: array
          description: |
            Actions to include (exact match). Empty/omitted
            disables the filter. Mutually exclusive with `actions_exclude`.
          items:
            type: string
          example:
            - list_applications
            - create_app
        actions_exclude:
          type: array
          description: |
            Actions to exclude (exact match). Empty/omitted disables the filter.
            Mutually exclusive with `actions`.
          items:
            type: string
          example:
            - delete_app
        resource_types:
          type: array
          description: |
            Resource types to include (exact match). Empty/omitted disables
            the filter. Mutually exclusive with `resource_types_exclude`.
          items:
            $ref: '#/components/schemas/ApiAuditLogResourceType'
        resource_types_exclude:
          type: array
          description: |
            Resource types to exclude (exact match). Empty/omitted disables the filter. Mutually exclusive
            with `resource_types`.
          items:
            $ref: '#/components/schemas/ApiAuditLogResourceType'
        sources:
          type: array
          description: |
            Source clients to include. Empty/omitted disables the filter;
            rows whose source matches one of the values are returned.
            Mutually exclusive with `sources_exclude`.
          items:
            $ref: '#/components/schemas/ApiAuditLogSource'
        sources_exclude:
          type: array
          description: |
            Source clients to exclude. Empty/omitted disables the filter.
            Mutually exclusive with `sources`.
          items:
            $ref: '#/components/schemas/ApiAuditLogSource'
        application_ids:
          type: array
          description: |
            Application resource_ids to include. Mutually exclusive with
            `application_ids_exclude`.
          items:
            type: string
          example:
            - 22a55c5d-92aa-4b04-9b54-3a8ec3d6d4af
        application_ids_exclude:
          type: array
          description: |
            Application resource_ids to exclude. Mutually exclusive with `application_ids`.
          items:
            type: string
        cluster_ids:
          type: array
          description: |
            Cluster resource_ids (numeric strings) to include. Mutually
            exclusive with `cluster_ids_exclude`.
          items:
            type: string
          example:
            - '7'
        cluster_ids_exclude:
          type: array
          description: |
            Cluster resource_ids (numeric strings) to exclude. Mutually exclusive with `cluster_ids`.
          items:
            type: string
        environment_group_names:
          type: array
          description: |
            Environment group names to include.
            Mutually exclusive with `environment_group_names_exclude`.
          items:
            type: string
          example:
            - my-env-group
        environment_group_names_exclude:
          type: array
          description: |
            Environment group names to exclude. Mutually exclusive with `environment_group_names`.
          items:
            type: string
        search:
          type: string
          maxLength: 255
          description: |
            Free-text search. Case-insensitive substring match against
            request path, the resolved user's email, and the resolved API
            token's display name; a row matches if any of these contain
            the value. Whitespace is trimmed; an empty value
            disables the filter. SQL wildcards (`%` and `_`) are matched
            literally. ANDs with all other filters in this query body.
          example: alice
    QueryApiAuditLogsRequestBody:
      description: Request body for `query_api_audit_logs` — filter set plus pagination.
