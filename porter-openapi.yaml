        preview_environment_name:
          type: string
          description: Deployment-target display name. Omitted on the cluster's default deployment target.
          example: PR 1234
        command:
          type: string
          description: CLI command the caller reported when the request was made. Omitted when the request carried no command.
          example: porter kubectl
    ApiAuditLogEntry:
      type: object
      required:
        - started_at
        - method
        - path
        - action
        - actor_type
        - actor_id
        - actor_name
        - user_agent
        - status_code
      properties:
        started_at:
          type: string
          format: date-time
          description: When the request entered the audit log middleware
          example: '2026-04-28T14:32:17.482Z'
        method:
          $ref: '#/components/schemas/ApiAuditLogMethod'
        path:
          type: string
          description: Full request path (no query string)
          example: /api/v2/projects/12492/applications
        action:
          type: string
          description: Human-readable action name
