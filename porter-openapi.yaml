  /api/v2/projects/{project_id}/clouds/{cloud_account_id}/gcp-wif-status:
    get:
      operationId: get_gcp_wif_status
      x-scalar-ignore: true
      security:
        - bearerAuth:
            - developer
      tags:
        - Cloud Accounts
      summary: Get the Workload Identity Federation connection status for a GCP cloud account
      description: |
        Returns the current state of the GCP cloud account's Workload
        Identity Federation setup, composed from the wif row (while
        initiating) and the cloud_account row (after the bootstrap
        callback cutover). Read-only; the connect and migrate dialogs
        both poll this on ~2s intervals while open.

        `state` is one of:
          - `none` — no wif row; either an SA-JSON account or a fresh
            flow that hasn't started initiation yet.
          - `initiated` — wif row exists; awaiting bootstrap.sh callback.
          - `syncing` — cutover happened; SyncIam in progress.
          - `connected` — fully provisioned, cloud_account.status = connected.
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 123
        - name: cloud_account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 4741dca9-ae17-417b-949e-1a18f91b77d9
      responses:
        '200':
          description: Current WIF connection state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GcpWifStatusResponseBody'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/projects/{project_id}/clouds/{cloud_account_id}/migrate-to-wif:
    post:
      operationId: migrate_gcp_cloud_account_to_wif
      x-scalar-ignore: true
      security:
        - bearerAuth:
            - developer
      tags:
        - Cloud Accounts
      summary: Migrate an existing GCP cloud account from service-account JSON to Workload Identity Federation
      description: |
        Attaches a fresh Workload Identity Federation row to an existing
        GCP cloud account that is currently authenticated via service-account
        JSON. The response shape is identical to `create_gcp_cloud_account`:
        a Cloud Shell deeplink + setup command the customer pastes into
        Cloud Shell to drive the Terraform-based bootstrap.

        The customer's existing service-account JSON credential is preserved
        on the row throughout migration; their clusters keep working via
        the old path until the WIF bootstrap callback succeeds and Porter
        cuts over to the federated identity.

        Gated by the `gcp_wif_enabled` feature flag. Rejects when the
        target row is not GCP, already has a WIF integration, or has no
        service-account JSON credential to migrate from.
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 123
        - name: cloud_account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 4741dca9-ae17-417b-949e-1a18f91b77d9
      responses:
        '200':
          description: Migration initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGcpCloudAccountResponseBody'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
