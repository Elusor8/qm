            for pods shorter-lived than the [3m, 24h] window. When false, callers
            should render "no data yet" rather than the zeroed metric fields.
        cpu_cores_p50:
          type: number
          format: double
          description: 50th percentile CPU usage in cores.
        cpu_cores_p90:
          type: number
          format: double
          description: 90th percentile CPU usage in cores.
        cpu_limit_cores:
          type: number
          format: double
          description: CPU limit configured on the sandbox pod, in cores. Zero when no limit is set.
        cpu_util_p50_pct:
          type: number
